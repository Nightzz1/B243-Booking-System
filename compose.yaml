services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drum_room}
      POSTGRES_USER: ${POSTGRES_USER:-drum_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrator
    environment: &database-environment
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-drum_room}
      PGUSER: ${POSTGRES_USER:-drum_room}
      PGPASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      DB_SSL: 'false'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *database-environment
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      AUTH_TRUST_PROXY: 'true'
      AUTH_LOGIN_ACCOUNT_LIMIT: ${AUTH_LOGIN_ACCOUNT_LIMIT:-8}
      AUTH_LOGIN_ACCOUNT_COOLDOWN_SECONDS: ${AUTH_LOGIN_ACCOUNT_COOLDOWN_SECONDS:-120}
      AUTH_LOGIN_IP_LIMIT: ${AUTH_LOGIN_IP_LIMIT:-120}
      AUTH_LOGIN_IP_COOLDOWN_SECONDS: ${AUTH_LOGIN_IP_COOLDOWN_SECONDS:-60}
      AUTH_REGISTER_IP_LIMIT: ${AUTH_REGISTER_IP_LIMIT:-30}
      AUTH_REGISTER_IP_COOLDOWN_SECONDS: ${AUTH_REGISTER_IP_COOLDOWN_SECONDS:-120}
      SYSTEM_ADMIN_ACCOUNT: ${SYSTEM_ADMIN_ACCOUNT:?请在 .env 中设置 SYSTEM_ADMIN_ACCOUNT}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:?请在 .env 中设置 SYSTEM_ADMIN_PASSWORD}
      SYSTEM_ADMIN_NAME: ${SYSTEM_ADMIN_NAME:-系统管理员}
      SYSTEM_ADMIN_CONTACT: ${SYSTEM_ADMIN_CONTACT:-系统维护}
      SYSTEM_ADMIN_PHONE: ${SYSTEM_ADMIN_PHONE:-仅限系统维护}
      SYSTEM_ADMIN_WECHAT: ${SYSTEM_ADMIN_WECHAT:-仅限系统维护}
      INITIAL_SEMESTER_START: ${INITIAL_SEMESTER_START:-2026-09-07}
      INITIAL_SEMESTER_END: ${INITIAL_SEMESTER_END:-2027-01-10}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      SESSION_IDLE_TTL_DAYS: ${SESSION_IDLE_TTL_DAYS:-7}
      SESSION_ABSOLUTE_TTL_DAYS: ${SESSION_ABSOLUTE_TTL_DAYS:-30}
      SESSION_RENEW_BEFORE_HOURS: ${SESSION_RENEW_BEFORE_HOURS:-24}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup-verify:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drum_room}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    networks: [backup-verification]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    environment:
      <<: *database-environment
      PGCONNECT_TIMEOUT: 10
      VERIFY_HOST: backup-verify
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ['sh', '/scripts/schedule.sh']
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${BACKUP_DIRECTORY:-./backups}:/backups
    networks: [default, backup-verification]
    depends_on:
      migrate:
        condition: service_completed_successfully
      backup-verify:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'sh', '/scripts/health.sh']
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 30m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backup-verification:
    internal: true
